name: Extension Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish; defaults to the triggering tag.
        required: false
        default: ""
        type: string
      duckdb_backed:
        description: Whether the connector ships the DuckDB dynamic runtime.
        required: false
        default: false
        type: boolean
    secrets:
      catalog_token:
        description: Fine-grained token allowed to dispatch irodori-table catalog sync.
        required: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate release source
    uses: irodori-table/irodori-kit/.github/workflows/extension-ci.yml@v0.9.2
    with:
      checkout-ref: ${{ inputs.release_tag || github.ref_name }}
      manifest-root: "."
      package-command: "make package"
      duckdb-backed: ${{ inputs.duckdb_backed }}

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.irodori-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux
            rustflags: -C link-arg=-Wl,-rpath,$ORIGIN
          - runner: ubuntu-24.04-arm
            target: aarch64-linux
            rustflags: -C link-arg=-Wl,-rpath,$ORIGIN
          - runner: macos-15-intel
            target: x86_64-macos
            rustflags: -C link-arg=-Wl,-rpath,@loader_path
          - runner: macos-15
            target: aarch64-macos
            rustflags: -C link-arg=-Wl,-rpath,@loader_path
          - runner: windows-2025
            target: x86_64-windows
            rustflags: ""
          - runner: windows-11-arm
            target: aarch64-windows
            rustflags: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout extension repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          repository: irodori-table/irodori-kit
          ref: v0.9.2
          path: .irodori-kit

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build native extension
        shell: bash
        env:
          DUCKDB_DOWNLOAD_LIB: ${{ inputs.duckdb_backed && '1' || '' }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          if ! cargo build --release --locked --message-format=json > "${RUNNER_TEMP}/native-build.jsonl"; then
            cat "${RUNNER_TEMP}/native-build.jsonl"
            exit 1
          fi

      - name: Stage the linked DuckDB runtime
        if: ${{ inputs.duckdb_backed }}
        shell: bash
        run: |
          node <<'DUCKDB_RUNTIME'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          const filename = { linux: 'libduckdb.so', darwin: 'libduckdb.dylib', win32: 'duckdb.dll' }[process.platform];
          if (!filename) throw new Error('Unsupported DuckDB runtime platform');
          const events = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'native-build.jsonl'), 'utf8')
            .split(/\r?\n/).filter(Boolean).map(line => JSON.parse(line));
          const builds = events.filter(event => event.reason === 'build-script-executed'
            && /(?:#|\s)libduckdb-sys(?:@|\s)/.test(event.package_id));
          if (new Set(builds.map(event => event.package_id)).size !== 1) {
            throw new Error('Expected exactly one linked libduckdb-sys package');
          }
          const candidates = [...new Set(builds.flatMap(event => event.linked_paths || [])
            .map(directory => path.join(directory.replace(/^native=/, ''), filename))
            .filter(file => fs.existsSync(file)).map(file => fs.realpathSync(file)))];
          if (!candidates.length) throw new Error('Linked DuckDB runtime is missing');
          const digest = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          if (new Set(candidates.map(digest)).size !== 1) throw new Error('Linked DuckDB runtimes disagree');
          const destination = path.join(process.env.CARGO_TARGET_DIR, 'release', filename);
          fs.copyFileSync(candidates[0], destination);
          if (digest(destination) !== digest(candidates[0])) throw new Error('Staged DuckDB runtime checksum mismatch');
          console.log(`Staged ${filename} from the current Cargo build: ${candidates[0]}`);
          DUCKDB_RUNTIME

      - name: Package target archive
        shell: bash
        run: |
          args=()
          if [[ "${{ inputs.duckdb_backed }}" == "true" ]]; then
            args+=(--include-library duckdb)
          fi
          node .irodori-kit/packages/extension-sdk/tools/package-native-extension.mjs "${args[@]}"

      - name: Verify archive contents
        shell: bash
        run: |
          archive="dist/${GITHUB_REPOSITORY#*/}-${{ matrix.target }}.tar.gz"
          test -f "${archive}"
          tar -tzf "${archive}" | sort > "${RUNNER_TEMP}/archive.txt"
          grep -qx 'connector.config.json' "${RUNNER_TEMP}/archive.txt"
          grep -qx 'irodori.extension.json' "${RUNNER_TEMP}/archive.txt"
          grep -Eq '^dist/native/.+\.(so|dll|dylib)$' "${RUNNER_TEMP}/archive.txt"

      - name: Upload target archive
        uses: actions/upload-artifact@v5
        with:
          name: extension-${{ matrix.target }}
          path: dist/*-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish immutable release
    needs: build
    runs-on: ubuntu-24.04
    env:
      CATALOG_TOKEN: ${{ secrets.catalog_token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout extension repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Download target archives
        uses: actions/download-artifact@v6
        with:
          # Exclude the validation job's generic extension-package artifact.
          pattern: extension-*-*
          path: dist
          merge-multiple: true

      - name: Create the legacy Linux archive alias
        shell: bash
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          cp "dist/${name}-x86_64-linux.tar.gz" "dist/${name}.tar.gz"

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          version=$(jq -r .version irodori.extension.json)
          test "${RELEASE_TAG}" = "v${version}"

      - name: Publish release (draft, attach, then publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retagging would make the catalog's recorded digest point at different
          # bytes. Bump the version instead.
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists; bump the version instead of retagging" >&2
            exit 1
          fi
          # Assets cannot be attached after publish once immutable releases are
          # enabled, so create a draft, attach every archive, then publish.
          gh release create "${RELEASE_TAG}" --verify-tag --draft --generate-notes \
            --title "${GITHUB_REPOSITORY#*/} ${RELEASE_TAG}"
          gh release upload "${RELEASE_TAG}" dist/*.tar.gz
          gh release edit "${RELEASE_TAG}" --draft=false

      - name: Dispatch extension catalog sync
        if: ${{ env.CATALOG_TOKEN != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ env.CATALOG_TOKEN }}
        run: |
          gh api --method POST repos/irodori-table/irodori-table/dispatches \
            -f event_type=extension-released \
            -f 'client_payload[repository]=${{ github.repository }}' \
            -f "client_payload[tag]=${RELEASE_TAG}"
