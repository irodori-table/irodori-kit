name: Extension CI

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Optional extension tag or commit to validate.
        required: false
        default: ""
        type: string
      manifest-root:
        description: Relative path to the extension manifest root in the caller repository.
        required: false
        default: "."
        type: string
      package-command:
        description: Command that builds the release archive under dist/.
        required: false
        default: "make package"
        type: string
      duckdb-backed:
        description: Whether the connector links the DuckDB-backed driver path.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-package:
    name: Validate and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout extension repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Checkout irodori-kit SDK
        uses: actions/checkout@v7
        with:
          repository: irodori-table/irodori-kit
          ref: v0.8.2
          path: .irodori-kit

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .irodori-kit/packages/extension-sdk/package-lock.json

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: extension-${{ runner.os }}-${{ github.repository }}-${{ inputs.duckdb-backed }}

      - name: Install extension SDK dependencies
        run: npm ci
        working-directory: .irodori-kit/packages/extension-sdk

      - name: Validate extension manifest
        env:
          IRODORI_EXTENSION_MANIFEST_ROOTS: ${{ github.workspace }}/${{ inputs.manifest-root }}
        run: npm run validate
        working-directory: .irodori-kit/packages/extension-sdk

      - name: Check declared auth methods against the driver
        run: node .irodori-kit/scripts/check-connector-auth.mjs "${{ inputs.manifest-root }}"

      - name: Check Rust formatting
        run: make fmt

      - name: Run Clippy
        run: make lint

      - name: Run Rust tests
        run: make test

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Build extension package
        run: ${{ inputs.package-command }}

      - name: Verify extension package
        shell: bash
        run: |
          shopt -s nullglob
          packages=(dist/*.tar.gz)
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'expected exactly one dist/*.tar.gz package, found %s\n' "${#packages[@]}" >&2
            exit 1
          fi
          tar -tzf "${packages[0]}" | sort > /tmp/irodori-extension-package.txt
          grep -qx 'connector.config.json' /tmp/irodori-extension-package.txt
          grep -qx 'irodori.extension.json' /tmp/irodori-extension-package.txt
          grep -q '^dist/native/' /tmp/irodori-extension-package.txt

      - name: Upload extension package
        uses: actions/upload-artifact@v5
        with:
          name: extension-package
          path: dist/*.tar.gz
          if-no-files-found: error
