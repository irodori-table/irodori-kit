name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      # The reusable workflows name their own version and owner. Three separate
      # fleet-wide breakages came from one of those drifting, each visible only
      # after the extension repositories adopted the tag.
      - name: Check workflow self-references
        run: node scripts/check-workflow-refs.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: audit-${{ runner.os }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  extension-sdk:
    name: Extension SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/extension-sdk/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/extension-sdk -> packages/extension-sdk/.irodori-local/target
          key: extension-sdk-${{ runner.os }}

      - name: Install SDK dependencies
        working-directory: packages/extension-sdk
        run: npm ci

      - name: Validate manifests
        working-directory: packages/extension-sdk
        run: npm run validate

      - name: Check reusable workflow version pins
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$version"
          grep -Fq "irodori-table/irodori-kit/.github/workflows/extension-ci.yml@v${version}" .github/workflows/extension-release.yml
          grep -Fq "ref: v${version}" .github/workflows/extension-ci.yml
          grep -Fq "ref: v${version}" .github/workflows/extension-release.yml

      - name: Test connector consistency guards
        run: node --test scripts/*.test.mjs

      - name: Check generated SDK API
        working-directory: packages/extension-sdk
        run: npm run typegen:check

      - name: Run SDK checks
        working-directory: packages/extension-sdk
        run: npm run check
